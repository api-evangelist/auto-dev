description: >-
  FinOps view of Auto.dev spend. Auto.dev bills a monthly plan base fee
  (Starter $0, Growth $299, Scale $599) plus per-call data fees charged on
  every request, with per-call rates that vary by product and decline at
  higher tiers. The Starter plan includes 1,000 calls/month; Growth and
  Scale are uncapped. Cost is driven primarily by request volume per product.
notes: >-
  Per-call rates are subject to change; verify against the Auto.dev pricing
  page during reconciliation.
