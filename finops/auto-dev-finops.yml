meters:
- name: plan_base_fee
  description: Monthly subscription base fee for the selected plan (Growth $299, Scale $599).
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
- name: vin_decode_calls
  description: VIN decode requests, billed per call (rate varies by plan).
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - plan
- name: listings_calls
  description: Vehicle listings search and lookup requests, billed per call.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - plan
- name: photos_calls
  description: Vehicle photos requests, billed per call.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - plan
- name: specifications_calls
  description: Specifications requests, billed per call.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - plan
- name: recalls_calls
  description: Vehicle recalls and open recalls requests, billed per call.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - plan
  - product
- name: premium_product_calls
  description: Premium product requests (OEM Build Data, Total Cost of Ownership, Plate-to-VIN, Payments, Interest Rates, Taxes & Fees), billed per call.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - plan
  - product
principles:
- name: Visibility
  description: Track per-product call counts; high-cost products (OEM Build Data, TCO, Open Recalls, Plate-to-VIN) dominate per-call spend.
- name: Allocation
  description: Tag API keys per workload/team and map per-product call volume to internal cost centers.
- name: Optimization
  description: Cache stable VIN decode and specifications responses; right-size the plan so the base fee plus per-call rate minimizes total cost at your volume; avoid premium products where listings/specs data suffices.
- name: Accountability
  description: Assign owners per project/key and review monthly base plus per-call spend against budget.
