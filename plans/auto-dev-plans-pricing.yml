specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Auto.dev
providerId: auto-dev
created: '2026-06-21'
modified: '2026-06-21'
reconciled: true
tags:
- Automotive
- Vehicle Data
- VIN Decoding
- Vehicle Listings
- Recalls
- Plans
description: >-
  Auto.dev uses tiered monthly plans plus per-call data fees charged on every
  request. The Starter tier is free with 1,000 included API calls per month and
  access to VIN Decode, Vehicle Listings, and Vehicle Photos only. Growth and
  Scale add a monthly base fee, unlimited call volume, higher rate limits, and
  access to additional products such as Specifications, Recalls, and OEM Build
  Data. All plans include MCP access. Per-call prices fall as you move up tiers.
notes: >-
  Representative per-call rates as published on the Auto.dev pricing page;
  check auto.dev/pricing for the current full catalog and rates.
sources:
- https://www.auto.dev/pricing
- https://docs.auto.dev/v2/products
plans:
- id: auto-dev-starter
  name: Starter
  type: free
  description: >-
    Free tier with 1,000 included API calls per month, a 5 requests/second
    rate limit, and access to VIN Decode, Vehicle Listings, and Vehicle Photos.
  entries:
  - label: Included API Calls
    name: included_calls
    type: included
    metric: requests
    limit: 1000
    timeFrame: month
    geo: global
    unit: 1
    price: $0 (included)
    userMultiplied: false
  - label: Global VIN Decode
